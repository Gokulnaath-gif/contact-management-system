<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Management System</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#222}
  .wrap{max-width:820px;margin:auto}
  h1{margin-top:0}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}
  input{padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;width:100%}
  button{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;font-size:14px;color:#fff;background:#2563eb}
  button.del{background:#dc2626} button.edit{background:#059669} button.cancel{background:#6b7280}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px}
  td:last-child{white-space:nowrap}
  #msg{margin-bottom:12px;padding:10px;border-radius:6px;display:none;font-size:14px}
  .ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
  @media(max-width:700px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contact Management System</h1>
  <div class="card">
    <div id="msg"></div>
    <form id="form">
      <input id="name" placeholder="Name" required>
      <input id="phone" placeholder="Phone (10 digits)" required>
      <input id="email" placeholder="Email (optional)">
      <div style="display:flex;gap:6px">
        <button type="submit" id="submitBtn">Add</button>
        <button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button>
      </div>
    </form>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>
<script>
const API = '/contacts';
let editingId = null;
let contacts = [];
const $ = (id) => document.getElementById(id);

function show(text, ok = true) {
  const m = $('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(() => (m.style.display = 'none'), 4000);
}
function esc(s = '') {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function load() {
  const res = await fetch(API);
  contacts = (await res.json()).data;
  $('list').innerHTML = contacts.length
    ? contacts.map((c, i) => `
      <tr>
        <td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email || '-')}</td>
        <td>
          <button class="edit" onclick="startEdit(${i})">Edit</button>
          <button class="del" onclick="removeContact(${i})">Delete</button>
        </td>
      </tr>`).join('')
    : '<tr><td colspan="4">No contacts yet.</td></tr>';
}
function startEdit(i) {
  const c = contacts[i];
  editingId = c.contactId;
  $('name').value = c.name;
  $('phone').value = c.phone;
  $('email').value = c.email || '';
  $('submitBtn').textContent = 'Update';
  $('cancelBtn').style.display = 'inline-block';
}
function reset() {
  editingId = null;
  $('form').reset();
  $('submitBtn').textContent = 'Add';
  $('cancelBtn').style.display = 'none';
}
$('cancelBtn').onclick = reset;
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: $('name').value, phone: $('phone').value };
  const email = $('email').value.trim();
  if (email) body.email = email;
  else if (editingId) body.email = '';
  const res = await fetch(editingId ? `${API}/${editingId}` : API, {
    method: editingId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const out = await res.json();
  if (!res.ok) return show((out.errors || [out.message]).join(', '), false);
  show(editingId ? 'Contact updated' : 'Contact added');
  reset();
  load();
};
async function removeContact(i) {
  if (!confirm('Delete this contact?')) return;
  const res = await fetch(`${API}/${contacts[i].contactId}`, { method: 'DELETE' });
  const out = await res.json();
  show(out.message, res.ok);
  load();
}
load();
</script>
</body>
</html>
